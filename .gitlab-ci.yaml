stages:
  - build
  - pages

variables:
  DOCKER_TLS_CERTDIR: ""

build_image:
  image: docker:24
  services:
    - name: docker:24-dind
      alias: dind
  stage: build
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
    - echo "Logging in to registry $CI_REGISTRY"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" $CI_REGISTRY
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - dev
  tags: []
  retry: 2
  when: on_success
  allow_failure: false
  # DinD requires privileged runners. If using shared runners set 'privileged: true' on your runner.
  privileged: true

pages:
  stage: pages
  image: alpine:latest
  script:
    - mkdir -p public
    - cp index.html tooplate-living-parallax.css tooplate-living-scripts.js public/ || true
    - cp -r images public/ || true
  artifacts:
    paths:
      - public
    expire_in: 1h
  only:
    - dev
